include required(classpath("application"))

backend {
  default = "Local"
  providers {
    Local {
      config {
        runtime-attributes = """
          String? docker
        """
        submit = "/bin/bash ${script}"
        submit-docker = """
          docker run --rm -i \
            -v ${cwd}:${docker_cwd} \
            ${docker} \
            /bin/bash ${docker_script}
        """
        kill = "docker stop ${docker_cid}"
        check-alive = "docker inspect ${docker_cid}"
        job-id-regex = "(.+)"
      }
    }
  }
}

call-caching {
  enabled = false
}

database {
  profile = "slick.jdbc.HsqldbProfile$"
  db {
    driver = "org.hsqldb.jdbcDriver"
    url = "jdbc:hsqldb:mem:cromwell-test;shutdown=false;hsqldb.tx=mvcc"
    connectionTimeout = 3000
  }
}
